name: money_report_monthly
description: Aplikasi pencatatan keuangan bulanan offline

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  provider: ^6.1.1

  # UI
  fl_chart: ^0.69.0
  flutter_slidable: ^3.1.1
  intl: ^0.19.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Biometric Auth
  local_auth: ^2.3.0

  # Icons
  cupertino_icons: ^1.0.8

  # File Picker & Share (BARU)
  file_picker: ^8.1.6
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
